# Publishes the site to GitHub Pages on every push to main.
#
# Replaces GitHub's built-in "Deploy from a branch" publishing (set Pages
# Source to "GitHub Actions" for this to take over). Added 1 Nov 2026 after a
# day of deploys refused with "in progress deployment": each finished deploy
# was left marked as running for about an hour and blocked the next one.
# The deploy job below cancels any such leftover before it deploys.
#
# The site is plain static files (.nojekyll), so the artifact is the
# repository as committed. inbox/ and other ignored files are never in it.

name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: read

# One deploy at a time; a newer push waits rather than cancelling one mid-way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Cancel leftover Pages deployments
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for sha in $(gh api "repos/$REPO/deployments?environment=github-pages&per_page=10" --jq '.[].sha' | sort -u); do
            [ "$sha" = "$GITHUB_SHA" ] && continue
            gh api -X POST "repos/$REPO/pages/deployments/$sha/cancel" >/dev/null 2>&1 \
              && echo "cancelled leftover deployment $sha" || true
          done

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
