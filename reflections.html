/* ── Scripture reference parsing ── */
/* "Psalm 41" -> {book:"Psalm", chapter:"41", verse:""}
   "Ecclesiastes 1:15" -> {book:"Ecclesiastes", chapter:"1", verse:"15"}
   "1 Corinthians 11" -> {book:"1 Corinthians", chapter:"11", verse:""}
   "Jeremiah" -> {book:"Jeremiah", chapter:"", verse:""} */
function parseRef(s){
  const m = String(s).trim().match(/^(.+?)\s+(\d+)(?::(.+))?$/);
  if(m){ return { book:m[1].trim(), chapter:m[2], verse:(m[3]||"").trim() }; }
  return { book:String(s).trim(), chapter:"", verse:"" };
}

/* index: book -> { chapter -> Set(verses) } */
const SCRIPTURE_INDEX = {};
ARTICLES.forEach(a => a.scripture.forEach(s => {
  const r = parseRef(s);
  const book = (SCRIPTURE_INDEX[r.book] = SCRIPTURE_INDEX[r.book] || {});
  if(r.chapter){
    const ch = (book[r.chapter] = book[r.chapter] || new Set());
    if(r.verse) ch.add(r.verse);
  }
}));

function byNum(a,b){ return parseInt(a,10) - parseInt(b,10); }

/* ── Build filter dropdowns ── */
function buildFilters(){
  const themeSet = new Set();
  const yearSet  = new Set();
  ARTICLES.forEach(a => {
    a.themes.forEach(t => themeSet.add(t));
    yearSet.add(a.date.substring(0, 4));
  });
  populate("filter-book",  Object.keys(SCRIPTURE_INDEX).sort());
  populate("filter-theme", [...themeSet].sort());
  populate("filter-year",  [...yearSet].sort().reverse());
}

function populate(id, values){
  const sel = document.getElementById(id);
  values.forEach(v => {
    const opt = document.createElement("option");
    opt.value = v; opt.textContent = v;
    sel.appendChild(opt);
  });
}

/* reset a select back to just "All"; optionally disable it */
function resetSelect(id, disabled){
  const sel = document.getElementById(id);
  sel.innerHTML = '<option value="">All</option>';
  sel.value = "";
  sel.disabled = !!disabled;
}

/* Book chosen → repopulate Chapter, but only if that book has chapters */
function onBookChange(){
  const book = document.getElementById("filter-book").value;
  resetSelect("filter-chapter", true);
  resetSelect("filter-verse", true);
  const chapters = book && SCRIPTURE_INDEX[book] ? Object.keys(SCRIPTURE_INDEX[book]) : [];
  if(chapters.length){
    populate("filter-chapter", chapters.sort(byNum));
    document.getElementById("filter-chapter").disabled = false;
  }
  render();
}

/* Chapter chosen → repopulate Verse, but only if that chapter has verses */
function onChapterChange(){
  const book = document.getElementById("filter-book").value;
  const chapter = document.getElementById("filter-chapter").value;
  resetSelect("filter-verse", true);
  const verses = (book && chapter && SCRIPTURE_INDEX[book] && SCRIPTURE_INDEX[book][chapter])
    ? [...SCRIPTURE_INDEX[book][chapter]] : [];
  if(verses.length){
    populate("filter-verse", verses.sort(byNum));
    document.getElementById("filter-verse").disabled = false;
  }
  render();
}

/* ── Render listing ── */
function render(){
  const bookF        = document.getElementById("filter-book").value;
  const chapterF     = document.getElementById("filter-chapter").value;
  const verseF       = document.getElementById("filter-verse").value;
  const themeFilter  = document.getElementById("filter-theme").value;
  const yearFilter   = document.getElementById("filter-year").value;
  const monthFilter  = document.getElementById("filter-month").value;

  const filtered = ARTICLES
    .filter(a => {
      if(bookF && !a.scripture.some(s => {
        const r = parseRef(s);
        if(r.book !== bookF) return false;
        if(chapterF && r.chapter !== chapterF) return false;
        if(verseF && r.verse !== verseF) return false;
        return true;
      })) return false;
      if(themeFilter && !a.themes.includes(themeFilter)) return false;
      if(yearFilter  && a.date.substring(0,4) !== yearFilter) return false;
      if(monthFilter && parseInt(a.date.substring(5,7)) !== parseInt(monthFilter)) return false;
      return true;
    })
    .sort((a,b) => b.date.localeCompare(a.date));

  const listing = document.getElementById("listing");
  const empty   = document.getElementById("empty");
  listing.innerHTML = "";

  if(filtered.length === 0){
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";

  filtered.forEach(a => {
    const d    = new Date(a.date + "T12:00:00");
    const dateStr = d.toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
    const card = document.createElement("div");
    card.className = "article-card";
    card.innerHTML = `
      <div class="card-date">${dateStr}</div>
      <div class="card-body">
        <h2 class="card-title"><a href="${a.url}">${a.title}</a></h2>
        <p class="card-summary">${a.summary}</p>
        <div class="card-meta">
          <span>${a.scripture.join(" · ")}</span>
        </div>
        ${a.poster ? `<a class="card-poster-link" href="${a.poster}" target="_blank" rel="noopener">View Poster →</a>` : ""}
      </div>`;
    listing.appendChild(card);
  });
}

function resetFilters(){
  document.getElementById("filter-book").value  = "";
  resetSelect("filter-chapter", true);
  resetSelect("filter-verse", true);
  document.getElementById("filter-theme").value = "";
  document.getElementById("filter-year").value  = "";
  document.getElementById("filter-month").value = "";
  render();
}

document.getElementById("filter-book").addEventListener("change",    onBookChange);
document.getElementById("filter-chapter").addEventListener("change", onChapterChange);
document.getElementById("filter-verse").addEventListener("change",   render);
document.getElementById("filter-theme").addEventListener("change",   render);
document.getElementById("filter-year").addEventListener("change",    render);
document.getElementById("filter-month").addEventListener("change",   render);

buildFilters();
render();
</script>
