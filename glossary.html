<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hebrew Devotional Glossary</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Cormorant+SC:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --parchment: #f5edd6;
    --parchment-dark: #e8d8b0;
    --parchment-mid: #eedfc0;
    --ink: #2a1f0e;
    --ink-light: #5a3e1b;
    --ink-faint: #8a6d45;
    --accent: #8b3a0f;
    --accent-light: #c0622a;
    --gold: #b8922c;
    --gold-light: #d4ac4a;
    --border: #c8a96e;
    --border-light: #ddc48a;
    --shadow: rgba(42,31,14,0.15);
    --panel-bg: rgba(245,237,214,0.9);

    /* Category colours */
    --cat-covenant: #5a3e7a;
    --cat-justice: #6b1e1e;
    --cat-love: #7a3520;
    --cat-wisdom: #1e4a3a;
    --cat-presence: #1e3560;
    --cat-trust: #4a3e10;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--parchment-dark);
    color: var(--ink);
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 16px;
    min-height: 100vh;
    overflow: hidden;
  }

  /* Parchment texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(184,146,44,0.08) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(139,58,15,0.06) 0%, transparent 60%),
      radial-gradient(ellipse at 50% 50%, rgba(255,255,255,0.12) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* ─── Layout ─── */
  .app { display: flex; height: 100vh; position: relative; z-index: 1; }

  /* ─── Sidebar ─── */
  .sidebar {
    width: 300px;
    min-width: 280px;
    background: linear-gradient(180deg, #e8d4a0 0%, #dfc896 50%, #e5d4a8 100%);
    border-right: 2px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 4px 0 20px var(--shadow);
  }

  .sidebar-header {
    padding: 22px 20px 16px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(135deg, rgba(184,146,44,0.15), rgba(139,58,15,0.08));
  }

  .sidebar-title {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.22em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 2px;
  }

  .sidebar-subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-size: 18px;
    font-weight: 500;
    color: var(--ink);
    font-style: italic;
    line-height: 1.2;
  }

  .term-count {
    font-family: 'Cormorant Garamond', serif;
    font-size: 12px;
    color: var(--ink-faint);
    margin-top: 4px;
  }

  /* Search */
  .search-wrap {
    padding: 14px 16px 10px;
    border-bottom: 1px solid var(--border-light);
  }

  .search-box {
    width: 100%;
    background: rgba(245,237,214,0.8);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 8px 12px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 14.5px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-box::placeholder { color: var(--ink-faint); font-style: italic; }
  .search-box:focus { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(184,146,44,0.15); }

  /* Category filters */
  .cat-filters {
    padding: 8px 16px 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    border-bottom: 1px solid var(--border-light);
  }

  .cat-btn {
    font-family: 'Cinzel', serif;
    font-size: 8.5px;
    letter-spacing: 0.12em;
    padding: 3px 8px;
    border-radius: 2px;
    border: 1px solid;
    cursor: pointer;
    transition: all 0.18s;
    background: transparent;
    text-transform: uppercase;
  }
  .cat-btn.all { border-color: var(--border); color: var(--ink-light); }
  .cat-btn.covenant { border-color: var(--cat-covenant); color: var(--cat-covenant); }
  .cat-btn.justice { border-color: var(--cat-justice); color: var(--cat-justice); }
  .cat-btn.love { border-color: var(--cat-love); color: var(--cat-love); }
  .cat-btn.wisdom { border-color: var(--cat-wisdom); color: var(--cat-wisdom); }
  .cat-btn.presence { border-color: var(--cat-presence); color: var(--cat-presence); }
  .cat-btn.trust { border-color: var(--cat-trust); color: var(--cat-trust); }

  .cat-btn.active { color: #fff !important; }
  .cat-btn.all.active { background: var(--ink-light); border-color: var(--ink-light); }
  .cat-btn.covenant.active { background: var(--cat-covenant); }
  .cat-btn.justice.active { background: var(--cat-justice); }
  .cat-btn.love.active { background: var(--cat-love); }
  .cat-btn.wisdom.active { background: var(--cat-wisdom); }
  .cat-btn.presence.active { background: var(--cat-presence); }
  .cat-btn.trust.active { background: var(--cat-trust); }

  /* Term list */
  .term-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px 0;
  }
  .term-list::-webkit-scrollbar { width: 5px; }
  .term-list::-webkit-scrollbar-track { background: transparent; }
  .term-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

  .term-item {
    padding: 10px 18px;
    cursor: pointer;
    border-bottom: 1px solid rgba(200,169,110,0.2);
    transition: background 0.15s;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .term-item:hover { background: rgba(245,237,214,0.6); }
  .term-item.active { background: rgba(245,237,214,0.9); border-left: 3px solid var(--accent); padding-left: 15px; }

  .term-heb-small {
    font-family: 'Cormorant Garamond', serif;
    font-size: 19px;
    font-weight: 400;
    color: var(--ink);
    direction: rtl;
    flex-shrink: 0;
  }
  .term-meta-small { flex: 1; min-width: 0; }
  .term-tr-small {
    font-family: 'Cormorant Garamond', serif;
    font-size: 14.5px;
    font-weight: 500;
    color: var(--ink-light);
    font-style: italic;
  }
  .term-gloss-small {
    font-size: 12px;
    color: var(--ink-faint);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .cat-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .sidebar-footer {
    padding: 12px 16px;
    border-top: 1px solid var(--border);
    background: rgba(200,169,110,0.12);
  }
  .add-btn {
    width: 100%;
    background: var(--accent);
    color: #f5edd6;
    border: none;
    padding: 9px 0;
    font-family: 'Cinzel', serif;
    font-size: 10px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    transition: background 0.2s;
  }
  .add-btn:hover { background: var(--accent-light); }

  /* ─── Main panel ─── */
  .main {
    flex: 1;
    overflow-y: auto;
    background: var(--parchment);
    padding: 0;
    position: relative;
  }
  .main::-webkit-scrollbar { width: 7px; }
  .main::-webkit-scrollbar-track { background: var(--parchment-mid); }
  .main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

  /* Empty state */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 12px;
    color: var(--ink-faint);
    padding: 40px;
    text-align: center;
  }
  .empty-glyph {
    font-size: 64px;
    opacity: 0.35;
    direction: rtl;
    font-family: 'Cormorant Garamond', serif;
    line-height: 1;
  }
  .empty-state h2 {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 0.2em;
    color: var(--ink-faint);
    text-transform: uppercase;
  }
  .empty-state p {
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    font-style: italic;
    color: var(--ink-faint);
    max-width: 300px;
  }

  /* Term detail */
  .term-detail {
    padding: 40px 50px 60px;
    max-width: 780px;
  }

  .detail-header {
    margin-bottom: 28px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border-light);
  }

  .detail-cat-label {
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .detail-cat-label .cat-pip {
    width: 8px; height: 8px;
    border-radius: 50%;
    display: inline-block;
  }

  .detail-hebrew {
    font-family: 'Cormorant Garamond', serif;
    font-size: 72px;
    font-weight: 300;
    line-height: 1;
    color: var(--ink);
    direction: rtl;
    margin-bottom: 8px;
    letter-spacing: 0.02em;
  }

  .detail-tr {
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px;
    font-weight: 400;
    font-style: italic;
    color: var(--ink-light);
    margin-bottom: 4px;
    letter-spacing: 0.02em;
  }

  .detail-gloss {
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    font-weight: 500;
    color: var(--ink-faint);
    letter-spacing: 0.05em;
    text-transform: uppercase;
    font-style: normal;
  }

  .detail-section {
    margin-bottom: 28px;
  }

  .detail-section-title {
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 10px;
    padding-bottom: 5px;
    border-bottom: 1px solid var(--border-light);
  }

  .detail-notes {
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    line-height: 1.75;
    color: var(--ink);
    font-weight: 400;
  }

  .detail-thread {
    font-family: 'Cormorant Garamond', serif;
    font-size: 16px;
    line-height: 1.7;
    color: var(--ink-light);
    font-style: italic;
  }

  .refs-list {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
  }
  .ref-chip {
    font-family: 'Cormorant SC', serif;
    font-size: 12.5px;
    padding: 3px 10px;
    border: 1px solid var(--border);
    border-radius: 2px;
    color: var(--ink-light);
    background: rgba(184,146,44,0.06);
    letter-spacing: 0.04em;
  }

  /* Actions */
  .detail-actions {
    display: flex;
    gap: 10px;
    margin-top: 36px;
    padding-top: 20px;
    border-top: 1px solid var(--border-light);
  }
  .btn-edit {
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 8px 20px;
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold);
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.18s;
  }
  .btn-edit:hover { background: var(--gold); color: var(--parchment); }
  .btn-delete {
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    padding: 8px 20px;
    background: transparent;
    border: 1px solid rgba(139,58,15,0.35);
    color: var(--ink-faint);
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.18s;
  }
  .btn-delete:hover { border-color: var(--accent); color: var(--accent); }

  /* ─── Modal ─── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(42,31,14,0.55);
    z-index: 100;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(3px);
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--parchment);
    border: 1px solid var(--border);
    width: 90%;
    max-width: 580px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(42,31,14,0.4);
    border-radius: 2px;
  }
  .modal-header {
    padding: 20px 24px 14px;
    border-bottom: 1px solid var(--border-light);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(135deg, rgba(184,146,44,0.08), transparent);
  }
  .modal-title {
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--ink);
  }
  .modal-close {
    background: none;
    border: none;
    font-size: 22px;
    color: var(--ink-faint);
    cursor: pointer;
    line-height: 1;
    padding: 0 4px;
    transition: color 0.15s;
  }
  .modal-close:hover { color: var(--accent); }
  .modal-body { padding: 22px 24px; }

  .form-row { margin-bottom: 16px; }
  .form-row label {
    display: block;
    font-family: 'Cinzel', serif;
    font-size: 8px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 5px;
  }
  .form-row input,
  .form-row select,
  .form-row textarea {
    width: 100%;
    background: rgba(245,237,214,0.7);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 8px 11px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s;
    resize: vertical;
  }
  .form-row input:focus,
  .form-row select:focus,
  .form-row textarea:focus { border-color: var(--gold); }
  .form-row textarea { min-height: 80px; }
  .form-hint {
    font-size: 11px;
    color: var(--ink-faint);
    font-style: italic;
    margin-top: 3px;
  }
  .form-row.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .modal-footer {
    padding: 14px 24px 20px;
    border-top: 1px solid var(--border-light);
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }
  .btn-cancel {
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 0.18em;
    padding: 9px 20px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--ink-faint);
    cursor: pointer;
    border-radius: 2px;
    text-transform: uppercase;
    transition: all 0.18s;
  }
  .btn-cancel:hover { border-color: var(--ink-faint); color: var(--ink); }
  .btn-save {
    font-family: 'Cinzel', serif;
    font-size: 9px;
    letter-spacing: 0.18em;
    padding: 9px 22px;
    background: var(--accent);
    border: 1px solid var(--accent);
    color: #f5edd6;
    cursor: pointer;
    border-radius: 2px;
    text-transform: uppercase;
    transition: background 0.2s;
  }
  .btn-save:hover { background: var(--accent-light); border-color: var(--accent-light); }

  /* Status bar */
  .status-bar {
    position: fixed;
    bottom: 20px;
    right: 24px;
    background: var(--ink);
    color: var(--parchment);
    padding: 8px 18px;
    border-radius: 2px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    font-style: italic;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.25s, transform 0.25s;
    z-index: 200;
    pointer-events: none;
  }
  .status-bar.show { opacity: 1; transform: translateY(0); }

  /* Ornamental divider */
  .ornament {
    text-align: center;
    color: var(--gold);
    font-size: 18px;
    margin: 24px 0;
    opacity: 0.6;
    letter-spacing: 0.3em;
  }

  /* Category colour helpers */
  .covenant-col { color: var(--cat-covenant); }
  .justice-col { color: var(--cat-justice); }
  .love-col { color: var(--cat-love); }
  .wisdom-col { color: var(--cat-wisdom); }
  .presence-col { color: var(--cat-presence); }
  .trust-col { color: var(--cat-trust); }

  .bg-covenant { background: var(--cat-covenant); }
  .bg-justice { background: var(--cat-justice); }
  .bg-love { background: var(--cat-love); }
  .bg-wisdom { background: var(--cat-wisdom); }
  .bg-presence { background: var(--cat-presence); }
  .bg-trust { background: var(--cat-trust); }

  /* ── Site nav ── */
  nav.hw-nav {
    background: #1f1b16;
    font-family: 'Cinzel', serif;
    font-size: .78rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    display: flex;
    justify-content: center;
    gap: 2.2rem;
    padding: 1.05rem 1rem;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 9999;
  }
  nav.hw-nav a { color: #f5edd6; text-decoration: none; opacity: .82; transition: opacity .2s; }
  nav.hw-nav a:hover { opacity: 1; color: #fff; }
  nav.hw-nav a.current { opacity: 1; border-bottom: 1px solid #b8922c; padding-bottom: .15rem; }
</style>
</head>
<body>

<nav class="hw-nav">
  <a href="/index.html">Home</a>
  <a href="/reflections.html">Reflections</a>
  <a href="/articles.html">Articles</a>
  <a href="/books.html">Books</a>
  <a href="/glossary.html" class="current">Glossary</a>
</nav>

<div class="app">

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">Onesimus Foundation</div>
      <div class="sidebar-subtitle">Hebrew Devotional<br>Glossary</div>
      <div class="term-count" id="term-count">Loading…</div>
    </div>

    <div class="search-wrap">
      <input class="search-box" id="search-input" type="text" placeholder="Search terms…" autocomplete="off" />
    </div>

    <div class="cat-filters" id="cat-filters">
      <button class="cat-btn all active" data-cat="all">All</button>
      <button class="cat-btn covenant" data-cat="covenant">Covenant</button>
      <button class="cat-btn justice" data-cat="justice">Justice</button>
      <button class="cat-btn love" data-cat="love">Love</button>
      <button class="cat-btn wisdom" data-cat="wisdom">Wisdom</button>
      <button class="cat-btn presence" data-cat="presence">Presence</button>
      <button class="cat-btn trust" data-cat="trust">Trust</button>
    </div>

    <div class="term-list" id="term-list"></div>

    <div class="sidebar-footer">
      <button class="add-btn" onclick="openModal(null)">+ Add New Term</button>
    </div>
  </div>

  <!-- Main panel -->
  <div class="main" id="main-panel">
    <div class="empty-state" id="empty-state">
      <div class="empty-glyph">אֱמוּנָה</div>
      <h2>Select a Term</h2>
      <p>Choose a word from the list to explore its meaning, canonical thread, and theological significance.</p>
    </div>
    <div class="term-detail" id="term-detail" style="display:none;"></div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="handleModalOverlayClick(event)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">Add Term</div>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="form-row two-col">
        <div>
          <label>Hebrew</label>
          <input id="f-heb" type="text" placeholder="e.g. חֶסֶד" dir="rtl" />
        </div>
        <div>
          <label>Transliteration</label>
          <input id="f-tr" type="text" placeholder="e.g. hesed" />
        </div>
      </div>
      <div class="form-row two-col">
        <div>
          <label>Gloss</label>
          <input id="f-gl" type="text" placeholder="Short definition" />
        </div>
        <div>
          <label>Category</label>
          <select id="f-cat">
            <option value="covenant">Covenant</option>
            <option value="justice">Justice / Righteousness</option>
            <option value="love">Love / Mercy</option>
            <option value="wisdom">Wisdom / Knowledge</option>
            <option value="presence">Presence / Rest</option>
            <option value="trust">Trust / Faith</option>
            <option value="other">Other</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <label>Theological Notes</label>
        <textarea id="f-notes" placeholder="Extended theological reflection on the term…"></textarea>
      </div>
      <div class="form-row">
        <label>Canonical Thread</label>
        <textarea id="f-thread" placeholder="How the term moves through Torah → Prophets → Writings → NT…" style="min-height:70px;"></textarea>
      </div>
      <div class="form-row">
        <label>Scripture References</label>
        <input id="f-refs" type="text" placeholder="e.g. Exod 34:6, Hos 6:6, Mic 6:8, John 1:14" />
        <div class="form-hint">Comma-separated</div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveEntry()">Save Term</button>
    </div>

// ─── State ────────────────────────────────────────────────────
let entries = [];
let selectedId = null;
let searchQuery = '';
let activeCategory = 'all';
let editingId = null;

// ─── Storage ─────────────────────────────────────────────────
const STORAGE_KEY = 'hebrew-glossary-v1';

async function loadFromStorage() {
  try {
    const result = await window.storage.get(STORAGE_KEY);
    if (result && result.value) {
      const stored = JSON.parse(result.value);
      entries = stored;
      // Merge any missing seed terms
      let changed = false;
      for (const seed of SEED_ENTRIES) {
        if (!entries.find(e => e.id === seed.id)) {
          entries.push(seed);
          changed = true;
        }
      }
      if (changed) await saveToStorage();
    } else {
      // First load — seed everything
      entries = [...SEED_ENTRIES];
      await saveToStorage();
    }
  } catch {
    // Storage unavailable — use seed data in memory
    entries = [...SEED_ENTRIES];
  }
}

async function saveToStorage() {
  try {
    await window.storage.set(STORAGE_KEY, JSON.stringify(entries));
  } catch {
    // silent fail — memory state still works
  }
}

// ─── Render ───────────────────────────────────────────────────
function filteredEntries() {
  return entries
    .filter(e => {
      if (activeCategory !== 'all' && e.category !== activeCategory) return false;
      if (!searchQuery) return true;
      const q = searchQuery.toLowerCase();
      return (
        (e.transliteration || '').toLowerCase().includes(q) ||
        (e.hebrew || '').includes(q) ||
        (e.gloss || '').toLowerCase().includes(q) ||
        (e.notes || '').toLowerCase().includes(q)
      );
    })
    .sort((a, b) => (a.transliteration || '').localeCompare(b.transliteration || ''));
}

function renderTermList() {
  const list = document.getElementById('term-list');
  const visible = filteredEntries();
  document.getElementById('term-count').textContent =
    `${entries.length} term${entries.length !== 1 ? 's' : ''}${searchQuery || activeCategory !== 'all' ? ` · ${visible.length} shown` : ''}`;

  list.innerHTML = visible.map(e => {
    const col = CAT_COL[e.category] || '#555';
    const active = e.id === selectedId ? 'active' : '';
    return `
      <div class="term-item ${active}" onclick="selectTerm('${e.id}')">
        <div class="cat-dot" style="background:${col};"></div>
        <div class="term-meta-small">
          <div class="term-tr-small">${esc(e.transliteration)}</div>
          <div class="term-gloss-small">${esc(e.gloss)}</div>
        </div>
        <div class="term-heb-small">${esc(e.hebrew)}</div>
      </div>`;
  }).join('');
}

  const catLabel = CAT_DISPLAY[e.category] || 'Other';
  const refs = Array.isArray(e.refs) ? e.refs : (e.refs || '').split(',').map(r => r.trim()).filter(Boolean);

  document.getElementById('empty-state').style.display = 'none';
  const d = document.getElementById('term-detail');
  d.style.display = 'block';
  d.innerHTML = `
    <div class="detail-header">
      <div class="detail-cat-label" style="color:${col};">
        <span class="cat-pip" style="background:${col};"></span>
        <span style="font-family:'Cinzel',serif;font-size:9px;letter-spacing:0.25em;">${catLabel.toUpperCase()}</span>
      </div>
      <div class="detail-hebrew">${esc(e.hebrew)}</div>
      <div class="detail-tr">${esc(e.transliteration)}</div>
      <div class="detail-gloss">${esc(e.gloss)}</div>
    </div>

    ${e.notes ? `
    <div class="detail-section">
      <div class="detail-section-title">Theological Notes</div>
      <div class="detail-notes">${esc(e.notes)}</div>
    </div>` : ''}

    ${e.thread ? `
    <div class="ornament">✦ ✦ ✦</div>
    <div class="detail-section">
      <div class="detail-section-title">Canonical Thread</div>
      <div class="detail-thread">${esc(e.thread)}</div>
    </div>` : ''}

    ${refs.length ? `
    <div class="detail-section">
      <div class="detail-section-title">Scripture References</div>
      <div class="refs-list">${refs.map(r => `<span class="ref-chip">${esc(r)}</span>`).join('')}</div>
    </div>` : ''}

    <div class="detail-actions">
      <button class="btn-edit" onclick="openModal('${e.id}')">Edit</button>
      <button class="btn-delete" onclick="deleteEntry('${e.id}')">Delete</button>
    </div>`;
}

function renderAll() {
  renderTermList();
  if (selectedId) {
    const found = filteredEntries().find(e => e.id === selectedId);
    if (found) renderDetail(selectedId);
    else { selectedId = null; showEmpty(); }
  } else {
    showEmpty();
  }
}

function showEmpty() {
  document.getElementById('empty-state').style.display = 'flex';
  document.getElementById('term-detail').style.display = 'none';
}

function selectTerm(id) {
  selectedId = id;
  renderTermList();
  renderDetail(id);
  // Scroll detail to top
  document.getElementById('main-panel').scrollTop = 0;
}

// ─── Category filters ─────────────────────────────────────────
document.getElementById('cat-filters').addEventListener('click', e => {
  const btn = e.target.closest('.cat-btn');
  if (!btn) return;
  activeCategory = btn.dataset.cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderAll();
});

// ─── Search ───────────────────────────────────────────────────
document.getElementById('search-input').addEventListener('input', e => {
  searchQuery = e.target.value;
  renderAll();
});

// ─── CRUD ─────────────────────────────────────────────────────
function openModal(id) {
  editingId = id || null;
  const e = id ? entries.find(x => x.id === id) : null;
  document.getElementById('modal-title').textContent = id ? 'Edit Term' : 'Add New Term';
  document.getElementById('f-heb').value = e?.hebrew || '';
  document.getElementById('f-tr').value = e?.transliteration || '';
  document.getElementById('f-gl').value = e?.gloss || '';
  document.getElementById('f-cat').value = e?.category || 'covenant';
  document.getElementById('f-notes').value = e?.notes || '';
  document.getElementById('f-thread').value = e?.thread || '';
  const refs = Array.isArray(e?.refs) ? e.refs : (e?.refs || '').split(',').map(r => r.trim()).filter(Boolean);
  document.getElementById('f-refs').value = refs.join(', ');
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  editingId = null;
}

function handleModalOverlayClick(event) {
  if (event.target === document.getElementById('modal-overlay')) closeModal();
}

async function saveEntry() {
  const tr = document.getElementById('f-tr').value.trim();
  const heb = document.getElementById('f-heb').value.trim();
  if (!tr && !heb) { alert('Please enter at least a transliteration or Hebrew text.'); return; }
  const refs = document.getElementById('f-refs').value.split(',').map(r => r.trim()).filter(Boolean);
  const entry = {
    id: editingId || ('u_' + Date.now()),
    hebrew: heb,
    transliteration: tr,
    gloss: document.getElementById('f-gl').value.trim(),
    category: document.getElementById('f-cat').value,
    notes: document.getElementById('f-notes').value.trim(),
    thread: document.getElementById('f-thread').value.trim(),
    refs,
    updated: Date.now()
  };
  if (editingId) {
    entries = entries.map(e => e.id === editingId ? entry : e);
    showStatus('Term updated.');
  } else {
    entries.push(entry);
    selectedId = entry.id;
    showStatus('Term added.');
  }
  closeModal();
  await saveToStorage();
  renderAll();
}

async function deleteEntry(id) {
  const e = entries.find(x => x.id === id);
  if (!confirm(`Delete "${e?.transliteration || 'this term'}"?`)) return;
  entries = entries.filter(x => x.id !== id);
  if (selectedId === id) selectedId = null;
  await saveToStorage();
  renderAll();
  showStatus('Term deleted.');
}

// ─── Status ───────────────────────────────────────────────────
let stTimer;
function showStatus(msg) {
  const bar = document.getElementById('status-bar');
  bar.textContent = msg;
  bar.classList.add('show');
  clearTimeout(stTimer);
  stTimer = setTimeout(() => bar.classList.remove('show'), 2400);
}

// ─── Utility ─────────────────────────────────────────────────
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── Init ─────────────────────────────────────────────────────
(async () => {
  await loadFromStorage();
  renderAll();
})();
</script>

</body>
</html>
